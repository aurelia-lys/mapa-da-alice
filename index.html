<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa da Alice</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background-color: #111;
      color: #f2e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #e5a4a4;
      margin-top: 30px;
    }
    .categoria {
      margin: 30px 0;
      text-align: center;
    }
    .categoria img {
      width: 300px;
      height: auto;
      margin-bottom: 10px;
    }
    .categoria h2 {
      color: #f3b5b5;
      margin-bottom: 10px;
    }
    a {
      color: #ffb6c1;
      text-decoration: none;
      font-size: 1.2em;
      border: 1px solid #ffb6c1;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 8px;
    }
    input, button {
      padding: 10px;
      margin-top: 10px;
      font-size: 1em;
    }
    #painel {
      display: none;
      text-align: center;
    }
    #acesso {
      text-align: center;
      margin-top: 100px;
    }
  </style>
  <script>
    function verificarSenha() {
      const senha = document.getElementById("senha").value;
      if (senha === "entreosespelhos") {
        document.getElementById("acesso").style.display = "none";
        document.getElementById("painel").style.display = "block";
      } else {
        alert("Senha incorreta.");
      }
    }
  </script>
</head>
<body>
  <div id="acesso">
    <h2>Digite a senha para acessar:</h2>
    <input type="password" id="senha" placeholder="Senha" />
    <button onclick="verificarSenha()">Entrar</button>
  </div>

  <div id="painel">
    <h1>Mapa da Alice</h1>

    <div class="categoria">
      <img src="icones/portas_veus_resized.png" alt="Portas para além do véu">
      <h2>Portas para além do véu</h2>
      <a href="https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion" target="_blank">Acessar</a>
    </div>

    <div class="categoria">
      <img src="icones/camera_termica_resized.png" alt="Câmera térmica">
      <h2>Câmera térmica</h2>
      <a href="https://exemplo.com/fotos" target="_blank">Abrir</a>
    </div>

    <div class="categoria">
      <img src="icones/laboratorio_silencio_resized.png" alt="Laboratório do Silêncio">
      <h2>Laboratório do Silêncio</h2>
      <a href="https://exemplo.com/ia" target="_blank">Explorar</a>
    </div>

    <div class="categoria">
      <img src="icones/obsidiana_resized.png" alt="Arquivos da Obsidiana">
      <h2>Arquivos da Obsidiana</h2>
      <a href="https://exemplo.com/personagem" target="_blank">Ver</a>
    </div>
  </div>
</body>
</html>
